    #compass {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      z-index: 9999;
    }

    /* ✨ Outer glass */
    .compass-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;

      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);

      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.35),
        inset 0 0 25px rgba(255, 255, 255, 0.05);
    }

    /* subtle inner ring */
    .compass-circle::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    /* directions */
    .dir {
      position: absolute;
      color: rgba(22, 4, 4, 0.8);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .north {
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff4d4d;
    }

    .south {
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
    }

    .east {
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
    }

    .west {
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 🔥 premium needle */
    .needle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 2px;
      height: 15px;
      transform: translate(-50%, -100%);
      transform-origin: bottom center;

      background: linear-gradient(to top, #ffffff, #ff4d4d);
      border-radius: 2px;
    }

    /* needle tip */
    .needle::after {
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 8px solid #ff4d4d;
    }

    /* center dot */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .needle {
      transform-origin: bottom center;
    }

    // 2) Create panoramas
    const panoLow = new PANOLENS.ImagePanorama(LOW_SRC);
    const panoHigh = new PANOLENS.ImagePanorama(HIGH_SRC);

    // 3) Viewer
    const viewer = new PANOLENS.Viewer({
      container: imageContainer,
      autoRotate: false,

      controlBar: false,
      cameraFov: 80
    });

    // after: const viewer = new PANOLENS.Viewer({...});
    let didInitView = false;

    // Keep the same initial yaw on both (texture yaw)
    const TEXTURE_YAW = -Math.PI / 2 + 0; // your existing value
    panoLow.rotation.y = TEXTURE_YAW;
    panoHigh.rotation.y = TEXTURE_YAW;

    // Desired tilt DOWN amount (pitch)
    const TILT_DOWN = Math.PI / 50; // ~16°

    function setInitialViewAndLockPitch() {
      if (didInitView) return;   // ✅ run only once (prevents flicker on swap)
      didInitView = true;

      const controls = viewer.getControl();

      // Positive value here, we pass -TILT to tilt DOWN
      const TILT = -Math.PI / 40;     // adjust how much you want to tilt
      controls.rotateUp(-TILT);      // tilt down

      // No vertical limits (free up/down)
      if ('minPolarAngle' in controls && 'maxPolarAngle' in controls) {
        controls.minPolarAngle = 0;          // can look straight up
        controls.maxPolarAngle = Math.PI;    // can look straight down
      }

      // Optional: rotation only (no panning)
      if ('enablePan' in controls) controls.enablePan = false;
    }


    // Apply same camera view when each pano becomes active
    panoLow.addEventListener('enter', setInitialViewAndLockPitch);
    panoHigh.addEventListener('enter', setInitialViewAndLockPitch);

    // Start with low; add both to viewer for smooth swap
    viewer.add(panoLow);
    viewer.add(panoHigh);
    viewer.setPanorama(panoLow);


    function degToRad(deg) {
      return deg * Math.PI / 180;
    }

    function setFromAngles(spot, yawDeg, pitchDeg, radius = 5000) {
      const yaw = degToRad(yawDeg);
      const pitch = degToRad(pitchDeg);

      const x = radius * Math.cos(pitch) * Math.sin(yaw);
      const y = radius * Math.sin(pitch);
      const z = radius * Math.cos(pitch) * Math.cos(yaw);

      spot.position.set(x, y, z);
    }











 // 🔴 Hotspot 1

  <script>
    window.addEventListener("load", () => {
      const needle = document.querySelector(".needle");

      let currentAngle = 0;
      let fixedNorth = null;
      let roomOffset = 90; // 👈 NEW

      function resetNorth() {
        const dir = new THREE.Vector3();
        viewer.camera.getWorldDirection(dir);
        fixedNorth = Math.atan2(dir.x, dir.z) * (180 / Math.PI);
      }

      function updateCompass() {
        const dir = new THREE.Vector3();
        viewer.camera.getWorldDirection(dir);

        let angle = Math.atan2(dir.x, dir.z) * (180 / Math.PI);

        if (fixedNorth === null) {
          resetNorth();
        }

        // 👇 APPLY ROOM OFFSET
        let targetAngle = angle - fixedNorth + roomOffset;

        let diff = targetAngle - currentAngle;
        diff = ((diff + 180) % 360) - 180;

        currentAngle += diff * 0.08;

        needle.style.transform =
          `translate(-50%, -100%) rotate(${currentAngle}deg)`;

        requestAnimationFrame(updateCompass);
      }

      updateCompass();

      // 👇 expose for manual control
      window.setRoomDirection = (deg) => {
        roomOffset = deg;
      };
    });
  </script>

    <script>
    (function(){
        const items=document.querySelectorAll('.dock-item'),dockItems=document.getElementById('dockItems');
        if(!dockItems||!items.length)return;
        const BASE=52,MAX=80,RANGE=140;
        function magnify(e){items.forEach(item=>{const icon=item.querySelector('.dock-icon'),svg=item.querySelector('.dock-icon svg'),label=item.querySelector('.dock-label'),rect=item.getBoundingClientRect(),cx=rect.left+rect.width/2,dist=Math.abs(e.clientX-cx);if(dist<RANGE){const t=1-dist/RANGE,sz=BASE+(MAX-BASE)*t;icon.style.width=sz+'px';icon.style.height=sz+'px';icon.style.borderRadius=(16+t*4)+'px';const iSz=22+t*10;svg.style.width=iSz+'px';svg.style.height=iSz+'px';item.style.width=sz+'px';if(t>.7){icon.style.background='linear-gradient(145deg,rgba(201,168,124,.2),rgba(201,168,124,.08))';icon.style.borderColor='rgba(201,168,124,.4)';icon.style.boxShadow='0 4px 24px rgba(201,168,124,.2)';svg.style.stroke='#c9a87c';svg.style.filter='drop-shadow(0 0 6px rgba(201,168,124,.4))';label.style.opacity='1';label.style.scale='1';label.style.translate='0 0';}else{reset(icon,svg,label);}}else{icon.style.width=BASE+'px';icon.style.height=BASE+'px';icon.style.borderRadius='16px';svg.style.width='22px';svg.style.height='22px';item.style.width=BASE+'px';reset(icon,svg,label);}});}
        function reset(icon,svg,label){icon.style.background='';icon.style.borderColor='';icon.style.boxShadow='';svg.style.stroke='';svg.style.filter='';label.style.opacity='0';label.style.scale='.9';label.style.translate='0 6px';}
        function resetAll(){items.forEach(item=>{const icon=item.querySelector('.dock-icon'),svg=item.querySelector('.dock-icon svg'),label=item.querySelector('.dock-label');icon.style.width=icon.style.height='';icon.style.borderRadius='';svg.style.width=svg.style.height='';item.style.width='';reset(icon,svg,label);});}
        dockItems.addEventListener('mousemove',magnify);dockItems.addEventListener('mouseleave',resetAll);
        items.forEach(c=>{c.addEventListener('click',e=>{c.classList.add('is-bouncing');c.addEventListener('animationend',()=>c.classList.remove('is-bouncing'),{once:true});const r=document.createElement('span');r.className='dock-ripple';const icon=c.querySelector('.dock-icon'),b=icon.getBoundingClientRect(),s=Math.max(b.width,b.height);r.style.width=r.style.height=s+'px';r.style.left=(e.clientX-b.left-s/2)+'px';r.style.top=(e.clientY-b.top-s/2)+'px';icon.appendChild(r);r.addEventListener('animationend',()=>r.remove());});});
    })();
    </script>

  <script>
    (function() {
      var btn = document.getElementById('enquiryBtn');
      var overlay = document.getElementById('enquiryOverlay');
      var closeBtn = document.getElementById('closeBtn');
      if (!btn || !overlay) return;

      // Stop Panolens from intercepting pointer events on the button
      btn.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
      btn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
      btn.addEventListener('touchstart', function(e) { e.stopPropagation(); });

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        btn.classList.add('is-hidden');
      });

      function close() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        btn.classList.remove('is-hidden');
      }

      if (closeBtn) closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });

      // === FORCE STYLE OVERRIDE after external JS runs ===
      // Some external JS files may re-apply styles; this ensures the button stays correct
      setTimeout(function() {
        btn.style.cssText = 'position:fixed!important;right:0!important;top:50%!important;transform:translateY(-50%)!important;z-index:10001!important;writing-mode:vertical-rl!important;text-orientation:mixed!important;padding:24px 13px!important;background:#111!important;color:#fff!important;font-family:"DM Sans",-apple-system,sans-serif!important;font-weight:700!important;font-size:11px!important;letter-spacing:2.5px!important;text-transform:uppercase!important;border:none!important;border-radius:12px 0 0 12px!important;cursor:pointer!important;white-space:nowrap!important;box-shadow:-4px 0 20px rgba(0,0,0,0.4)!important;pointer-events:auto!important;overflow:visible!important;display:block!important;opacity:1!important;visibility:visible!important;';
      }, 100);
    })();
