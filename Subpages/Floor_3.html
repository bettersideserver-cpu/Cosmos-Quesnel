    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .content-wrapper {
            position: relative;
            display: inline-block;
        }

        .content-wrapper img {
            display: block;
            height: auto;
            width: 100%;
        }

        .Cutout {

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--scene-scale, 1));
            width: 90vmin;
            /* aspect-ratio: 4096 / 4096; */
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 1;
        }

        .Cutout svg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
        }

        .Cutout path {
            pointer-events: auto;
            fill: transparent;
            pointer-events: auto;
            cursor: pointer;
            stroke: transparent;
            stroke-width: 8px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.3s ease, fill 0.3s ease;
        }


        .Cutout path:hover {
            /* stroke: rgb(141, 127, 205);
    fill: rgba(0, 0, 255, 0.2); */
            /* stroke: #004771; */
            stroke: #a3845d;
            /* fill: rgba(0, 71, 113, 0.4); */
            fill: rgba(186, 167, 145, 0.4);
        }


        .Cutout path.selected {
            /* stroke: rgb(255, 140, 0); */
            /* stroke: rgb(233, 182, 59); */
            /* stroke: #00629b; */
            stroke: #8d7252;
            /* Orange */
            /* fill: rgba(0, 71, 113, 0.5); */
            fill: rgba(163, 146, 128, 0.5);
        }

        .lobby-top {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(7, 7, 7);
        }

        .content-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .content-wrapper img {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .lobby-top {
                overflow: hidden;
                cursor: grab;
                align-items: flex-start;
                justify-content: flex-start;
            }

            .lobby-top.dragging {
                cursor: grabbing;
            }

            .content-wrapper {
                position: absolute;
                top: 0;
                left: 0;
                width: auto;
                height: 100vh;
                will-change: transform;
            }

            .content-wrapper img {
                display: block;
                width: auto;
                height: 100vh;
                max-width: none;
                object-fit: fill;
            }

            .Cutout {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: none;
            }

            .Cutout svg {
                top: 0;
                left: 0;
                transform: none;
                /* 🔥 IMPORTANT */
                width: 100%;
                height: 100%;
                min-width: unset;
                min-height: unset;
            }
        }


        .touch-button {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%) scale(var(--btn-scale, 1));
            transform-origin: center center;

            padding: 12px 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            color: #000;
            cursor: pointer;
            z-index: 10;
        }

        /* FLOOR PILL BASE */
        .floor-pill {
            position: fixed;
            top: 20px;
            right: 20px;
            /* FIXED */
            z-index: 9999;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 999px;
            padding: 8px 12px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            font-family: sans-serif;
        }

        /* BUTTON */
        .floor-pill__trigger {
            color: #000000;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background 0.3s;
        }

        .floor-pill__trigger:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* DROPDOWN */
        .floor-pill__list {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            transform-origin: top;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;

            display: flex;
            flex-direction: column;
            gap: 8px;

            /* ✅ CONTROL SIZE HERE */
            width: 100px;
            /* fixed width */
            max-height: 220px;
            /* limit height */
            overflow-y: auto;
            /* scroll if too many items */

            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        /* OPEN STATE */
        .floor-pill.open .floor-pill__list {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        /* ITEMS */
        .floor-pill__item {
            color: #000000;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.25s;

            text-align: center;
            /* 👈 centers text */
            display: block;
            /* ensures full width clickable */
        }

        .floor-pill__item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ACTIVE */
        .floor-pill__item.active {
            background: rgba(201, 168, 124, 0.25);
            color: #c9a87c;
        }

            position: fixed;

        .blur-up {
            filter: blur(10px);
            transform: scale(1.02);
            transition: filter .45s ease, transform .45s ease, opacity .35s ease;

            filter: blur(0);

            pointer-events: none;

    <script>
        // Mobile drag-to-pan (horizontal only)
        (function () {
            if (window.innerWidth > 600) return;
            const lobby = document.querySelector('.lobby-top');
            const wrapper = document.querySelector('.content-wrapper');
            if (!lobby || !wrapper) return;

            let isDragging = false;
            let startX = 0;
            let translateX = 0;

            function getImgWidth() {
                const img = wrapper.querySelector('img');
                return img ? img.offsetWidth : window.innerWidth;
            }

            function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }

            function applyTransform() {
                const minX = -(getImgWidth() - window.innerWidth);
                translateX = clamp(translateX, minX, 0);
                wrapper.style.transform = `translateX(${translateX}px)`;
            }

            // Touch
            lobby.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                isDragging = true;
                startX = e.touches[0].clientX - translateX;
                lobby.classList.add('dragging');
            }, { passive: true });

            lobby.addEventListener('touchmove', e => {
                if (!isDragging || e.touches.length !== 1) return;
                translateX = e.touches[0].clientX - startX;
                applyTransform();
            }, { passive: true });

            lobby.addEventListener('touchend', () => {
                isDragging = false;
                lobby.classList.remove('dragging');
            });

            // Mouse (desktop fallback)
            lobby.addEventListener('mousedown', e => {
                isDragging = true;
                startX = e.clientX - translateX;
                lobby.classList.add('dragging');
            });
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                applyTransform();
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                lobby.classList.remove('dragging');
            });

            // Init: start centered
            window.addEventListener('load', () => {
                translateX = -((getImgWidth() - window.innerWidth) / 2);
                applyTransform();
            });
        })();
    </script>

                pill.classList.toggle('open');

                });

fetch(sheetURL)
.then(response => response.json())
.then(data => {

    data.forEach(unit => {

        const svg = document.querySelector(`[data-unit="${unit.unit}"]`);
        if (!svg) return;

        let color = "transparent";

        switch(unit.status.toLowerCase().trim()){

            case "sold":
                color = "rgba(255,0,0,.45)";
                break;

            case "available":
                color = "rgba(0,204,68,.45)";
                break;

            case "hold":
                color = "rgba(255,153,0,.45)";
                break;

            case "booked":
                color = "rgba(0,102,255,.45)";
                break;
        }

        unitColors[unit.unit] = color;
        svg.style.fill = color;
    });

});
