<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmos Quesnel</title>
    <link rel="stylesheet" href="wbn05d6fbh.css">
    <link rel="stylesheet" href="JS/CSS/Floor-Hint.css">
    <link rel="stylesheet" href="JS/Notification/UI_Hint-CSS.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════
           DESIGN TOKENS
           ═══════════════════════════════════════════════ */
        :root {
            /* ——— WHITE / EDITORIAL THEME ——— */
            --bg-0: #F5F2EB;
            --bg-tint: #EDE8DD;

            --surface-1: rgba(255, 255, 255, 0.72);
            --surface-2: rgba(255, 255, 255, 0.88);
            --surface-3: rgba(255, 255, 255, 0.98);

            --ink: #17181D;
            --ink-soft: rgba(23, 24, 29, 0.62);
            --ink-mid: rgba(23, 24, 29, 0.62);
            --ink-dim: rgba(23, 24, 29, 0.40);
            --ink-faint: rgba(23, 24, 29, 0.22);
            --ink-trace: rgba(23, 24, 29, 0.09);

            --line: rgba(23, 24, 29, 0.07);
            --line-hi: rgba(23, 24, 29, 0.12);

            --gold: #A8782A;
            --gold-light: #C89A3F;
            --gold-dark: #7A561B;
            --gold-soft: rgba(168, 120, 42, 0.09);
            --gold-tint: rgba(168, 120, 42, 0.14);

            --glass: rgba(255, 255, 255, 0.80);
            --glass-border: rgba(23, 24, 29, 0.08);
            --glass-border-hover: rgba(168, 120, 42, 0.35);

            --text: #17181D;
            --text-muted: rgba(23, 24, 29, 0.55);

            --shadow-sm: 0 2px 8px rgba(23, 24, 29, 0.08);
            --shadow-md: 0 8px 24px rgba(23, 24, 29, 0.10);
            --shadow-lg: 0 16px 48px rgba(23, 24, 29, 0.13);

            --font-display: 'Cormorant Garamond', serif;
            --font-ui: 'Outfit', sans-serif;
            --ease-out: cubic-bezier(0.22, 0.68, 0, 1.04);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --blur: blur(28px) saturate(1.5);
        }

        /* ═══════════════════════════════════════════════
           ORIGINAL PAGE STYLES (preserved)
           ═══════════════════════════════════════════════ */
        body {
            background: var(--bg-0);
            color: var(--ink);
        }

        @media (max-width: 600px) {
            .Front {
                position: fixed;
                top: 55%;
                left: 50%;
            }
        }


        /* ── FAB CLUSTER ── */
        .fab-cluster {
            position: fixed;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fab-item {
            display: flex;
            align-items: center;
            gap: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            text-decoration: none;
            border: none;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            transition: width 0.25s cubic-bezier(.4, 0, .2, 1), border-radius 0.25s ease;
            white-space: nowrap;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-size: 12px;
            font-weight: 600;
        }

        .fab-item:hover {
            width: 140px;
            border-radius: 22px;
        }

        .fab-whatsapp {
            background: #25d366;
            color: #fff;
        }

        .fab-whatsapp:hover {
            background: #1ebe5d;
        }

        .fab-email {
            background: #1a73e8;
            color: #fff;
        }

        .fab-email:hover {
            background: #1558c0;
        }

        .fab-location {
            background: #ea4335;
            color: #fff;
        }

        .fab-location:hover {
            background: #d33426;
        }

        .fab-icon {
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .fab-icon svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .fab-label {
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.2s ease 0.05s, transform 0.2s ease 0.05s;
            padding-right: 14px;
            color: #fff;
        }

        .fab-item:hover .fab-label {
            opacity: 1;
            transform: translateX(0);
        }

        @media (max-width: 600px) {
            .fab-cluster {
                left: 10px;
                top: auto;
                bottom: 150px;
                transform: none;
                gap: 8px;
            }

            .fab-item {
                width: 40px;
                height: 40px;
            }

            .fab-item:hover {
                width: 40px;
                border-radius: 50%;
            }

            .fab-label {
                display: none;
            }
        }

        /* JUMP BAR */
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

        #jumpBar {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11000;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.18);
            font-family: 'DM Sans', -apple-system, sans-serif;
        }

        #jumpBar a {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            padding: 0 20px;
            border-radius: 50px;
            text-decoration: none;
            color: #555;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }

        #jumpBar a:hover {
            color: #111;
            background: #f0f0f0;
        }

        #jumpBar a.active {
            color: #fff;
            background: #111;
            font-weight: 600;
        }





        /* ═══════════════════════════════════════════════
           AMBIENT
           ═══════════════════════════════════════════════ */
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 120, 42, 0.05), transparent 65%);
            pointer-events: none;
            z-index: 9999;
            animation: ambient-pulse 6s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(168, 120, 42, 0.04), transparent 65%);
            pointer-events: none;
            z-index: 9999;
            animation: ambient-pulse 8s ease-in-out 2s infinite alternate;
        }

        @keyframes ambient-pulse {
            from {
                opacity: 0.6;
            }

            to {
                opacity: 1;
            }
        }

        .ambient-particles {
            position: fixed;
            inset: 0;
            z-index: 9998;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-particles .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: particle-float linear infinite;
        }

        @keyframes particle-float {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }

            10% {
                opacity: 0.4;
            }

            90% {
                opacity: 0.2;
            }

            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        ::selection {
            background: rgba(168, 120, 42, 0.3);
            color: var(--ink);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(168, 120, 42, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 120, 42, 0.5);
        }



        /* ═══════════════════════════════════════════════
           LIVE BUTTON
           ═══════════════════════════════════════════════ */
        .live-btn-bottom {
            position: fixed;
            left: 20px;
            bottom: 28px;
            z-index: 11000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            background: #ef4444;
            color: #fff;
            border-radius: 50px;
            text-decoration: none;
            font-family: 'DM Sans', -apple-system, sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 8px 24px rgba(239, 68, 68, .45),
                0 2px 8px rgba(0, 0, 0, .18);
            transition: all .2s ease;
        }

        .live-btn-bottom:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(239, 68, 68, .55),
                0 4px 10px rgba(0, 0, 0, .2);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            animation: live-pulse 1.5s ease-in-out infinite;
        }

        .live-dot::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .6);
            animation: live-ring 1.6s ease-out infinite;
        }

        @keyframes live-pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .65;
            }
        }

        @keyframes live-ring {
            0% {
                opacity: .7;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.8);
            }
        }

        @media (max-width:600px) {
            .live-btn-bottom {
                left: 10px;
                bottom: 90px;
                padding: 10px 16px;
                font-size: 11px;
            }
        }







        /* ═══════════════════════════════════════════════
           GALLERY LIGHTBOX (ADDED)
           ═══════════════════════════════════════════════ */
        .gallery-overlay {
            position: fixed;
            inset: 0;
            z-index: 13000;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gallery-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .gallery-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 2;
        }

        .gallery-close:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(168, 120, 42, 0.4);
            color: var(--gold);
        }

        .gallery-counter {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--ink-dim);
            z-index: 2;
        }

        .gallery-main {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 60px 120px;
            box-sizing: border-box;
        }

        .gallery-main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 2;
        }

        .gallery-nav:hover {
            background: rgba(168, 120, 42, 0.15);
            border-color: rgba(168, 120, 42, 0.4);
            color: var(--gold);
        }

        .gallery-prev {
            left: 20px;
        }

        .gallery-next {
            right: 20px;
        }

        .gallery-thumbs {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
            max-width: 90vw;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .gallery-thumbs::-webkit-scrollbar {
            display: none;
        }

        .gallery-thumb {
            width: 52px;
            height: 36px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            opacity: 0.5;
            transition: all 0.25s ease;
        }

        .gallery-thumb.is-active {
            border-color: var(--gold);
            opacity: 1;
        }

        .gallery-thumb:hover {
            opacity: 0.85;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            .gallery-main {
                padding: 70px 16px 100px;
            }

            .gallery-nav {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .gallery-prev {
                left: 8px;
            }

            .gallery-next {
                right: 8px;
            }

            .gallery-thumb {
                width: 40px;
                height: 28px;
            }
        }

        /* ═══════════════════════════════════════════════
           WALKTHROUGH VIDEO MODAL (ADDED)
           ═══════════════════════════════════════════════ */
        .walkthrough-overlay {
            position: fixed;
            inset: 0;
            z-index: 13000;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .walkthrough-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .walkthrough-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            z-index: 2;
        }

        .walkthrough-close:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(168, 120, 42, 0.4);
            color: var(--gold);
        }

        .walkthrough-video-wrap {
            width: 90vw;
            max-width: 960px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(168, 120, 42, 0.15);
        }

        .walkthrough-video-wrap video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        @media (max-width: 600px) {
            .walkthrough-video-wrap {
                width: 96vw;
                border-radius: 8px;
            }
        }




        @media (min-width: 769px) {




            /* ══════════════════════════════════════════
           AMENITY BAR — Top Center
           ══════════════════════════════════════════ */
            .amenity-bar {
                position: fixed;
                top: 26px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10000;
                display: inline-flex;
                align-items: center;
                gap: 4px;
                background: #ffffff;
                border-radius: 50px;
                padding: 5px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28), 0 2px 8px rgba(0, 0, 0, 0.18);
                font-family: 'DM Sans', -apple-system, sans-serif;
                max-width: calc(100vw - 40px);
                overflow-x: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .amenity-bar::-webkit-scrollbar {
                display: none;
            }

            .amenity-bar a {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                height: 36px;
                padding: 0 14px;
                border-radius: 50px;
                text-decoration: none;
                color: #555;
                font-size: 12px;
                font-weight: 500;
                letter-spacing: 0.3px;
                transition: all 0.2s ease;
                white-space: nowrap;
                cursor: pointer;
                flex-shrink: 0;
            }

            .amenity-bar a:hover {
                color: #111;
                background: #f0f0f0;
            }

            .amenity-bar a.active {
                color: #fff;
                background: #111;
                font-weight: 600;
            }

            .amenity-bar a.active svg {
                stroke: #fff;
            }

            .amenity-bar svg {
                width: 14px;
                height: 14px;
                stroke: currentColor;
                flex-shrink: 0;
            }

            @media (max-width: 600px) {
                .amenity-bar {
                    top: 75px;
                    left: 50%;
                    padding: 4px;
                    gap: 2px;
                    max-width: calc(100vw - 20px);
                }

                .amenity-bar a {
                    height: 30px;
                    padding: 0 10px;
                    font-size: 10.5px;
                    gap: 5px;
                }

                .amenity-bar svg {
                    width: 12px;
                    height: 12px;
                }

            }


            .enquiry-btn {
                position: fixed;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                z-index: 10001;
                writing-mode: vertical-rl;
                text-orientation: mixed;
                padding: 24px 13px;
                background: #111;
                color: #fff;
                font-family: 'DM Sans', -apple-system, sans-serif;
                font-weight: 700;
                font-size: 11px;
                letter-spacing: 2.5px;
                text-transform: uppercase;
                border: none;
                border-radius: 12px 0 0 12px;
                cursor: pointer;
                white-space: nowrap;
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.4);
                transition: opacity 0.3s ease, background 0.2s ease;
            }

            .enquiry-btn::after {
                content: '';
                position: absolute;
                inset: -4px;
                border-radius: 14px 0 0 14px;
                border: 2px solid rgba(255, 255, 255, 0.25);
                animation: eq-ring 2.5s ease-out infinite;
                pointer-events: none;
            }

            @keyframes eq-ring {
                0% {
                    opacity: 0.7;
                    transform: scale(1);
                }

                100% {
                    opacity: 0;
                    transform: scale(1.08);
                }
            }

            .enquiry-btn.is-hidden {
                opacity: 0;
                pointer-events: none;
            }

            .enquiry-btn:hover {
                background: #2a2a2a;
            }

            @media (max-width: 600px) {
                .enquiry-btn {
                    font-size: 9px;
                    padding: 18px 10px;
                }
            }

            .enquiry .overlay {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: stretch;
                justify-content: flex-end;
                background: rgba(0, 0, 0, 0);
                backdrop-filter: blur(0px);
                -webkit-backdrop-filter: blur(0px);
                z-index: 99999;
                pointer-events: none;
                transition: background 0.35s ease, backdrop-filter 0.35s ease;
            }

            .enquiry .overlay.is-open {
                background: rgba(0, 0, 0, 0.52);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
                pointer-events: auto;
            }

            .enquiry .modal {
                width: min(400px, 100vw);
                height: 100%;
                background: rgba(15, 15, 18, 0.75);
                backdrop-filter: blur(60px) saturate(130%);
                -webkit-backdrop-filter: blur(60px) saturate(130%);
                border-left: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 0;
                box-shadow: -12px 0 50px rgba(0, 0, 0, 0.6);
                display: flex;
                flex-direction: column;
                justify-content: center;
                transform: translateX(100%);
                transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            .enquiry .overlay.is-open .modal {
                transform: translateX(0);
            }

            .enquiry .modal-header {
                padding: 20px 20px 12px;
                display: flex;
                align-items: center;
                gap: 10px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .enquiry .modal-header::before {
                content: '';
                flex-shrink: 0;
                width: 2px;
                height: 18px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 2px;
            }

            .enquiry .modal-header .title {
                flex: 1;
                color: rgba(255, 255, 255, 0.9);
                font-weight: 500;
                font-size: 16px;
                letter-spacing: 0.3px;
            }

            .enquiry .close {
                flex-shrink: 0;
                width: 30px;
                height: 30px;
                display: grid;
                place-items: center;
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.04);
                color: rgba(255, 255, 255, 0.35);
                cursor: pointer;
                font-size: 13px;
                transition: all 0.2s;
            }

            .enquiry .close:hover {
                background: rgba(255, 255, 255, 0.08);
                color: rgba(255, 255, 255, 0.6);
            }

            .enquiry .modal-body {
                padding: 20px;
                overflow-y: auto;
                flex: 1;
            }

            .enquiry .form {
                display: grid;
                gap: 12px;
                width: 100%;
                box-sizing: border-box;
            }

            .enquiry .input,
            .enquiry .select,
            .enquiry .phone {
                width: 100%;
                box-sizing: border-box;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 10px;
                padding: 12px 14px;
                font-size: 13px;
                color: rgba(255, 255, 255, 0.85);
                font-family: 'DM Sans', -apple-system, sans-serif;
                transition: border-color 0.2s, background 0.2s;
            }

            .enquiry .input:focus,
            .enquiry .select:focus,
            .enquiry .phone:focus-within {
                outline: none;
                border-color: rgba(255, 255, 255, 0.15);
                background: rgba(255, 255, 255, 0.07);
            }

            .enquiry .input::placeholder {
                color: rgba(255, 255, 255, 0.22);
            }

            .enquiry .select {
                appearance: none;
                cursor: pointer;
                background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"><path d="M7 10l5 5 5-5" fill="none" stroke="%23666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
                background-repeat: no-repeat;
                background-position: right 12px center;
            }

            .enquiry .phone {
                display: flex;
                padding: 0;
            }

            .enquiry .phone select {
                appearance: none;
                border: none;
                border-right: 1px solid rgba(255, 255, 255, 0.07);
                padding: 0 10px;
                min-width: 72px;
                background: transparent;
                color: rgba(255, 255, 255, 0.6);
                font-size: 13px;
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            .enquiry .phone input {
                flex: 1;
                border: none;
                background: transparent;
                padding: 12px;
                font-size: 13px;
                color: rgba(255, 255, 255, 0.85);
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            .enquiry .phone input::placeholder {
                color: rgba(255, 255, 255, 0.22);
            }

            .enquiry .agree {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                font-size: 11px;
                color: rgba(255, 255, 255, 0.25);
            }

            .enquiry .agree a {
                color: rgba(255, 255, 255, 0.45);
                text-decoration: underline;
            }

            .enquiry .submit {
                width: 100%;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                padding: 13px;
                font-weight: 500;
                font-size: 13px;
                letter-spacing: 0.5px;
                background: rgba(255, 255, 255, 0.08);
                color: rgba(255, 255, 255, 0.85);
                cursor: pointer;
                margin-top: 4px;
                transition: all 0.2s ease;
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            .enquiry .submit:hover {
                background: rgba(255, 255, 255, 0.14);
                border-color: rgba(255, 255, 255, 0.15);
                color: rgba(255, 255, 255, 0.95);
            }

            .submit[aria-busy="true"] {
                position: relative;
                pointer-events: none;
                opacity: .8;
            }

            .submit[aria-busy="true"]::after {
                content: "";
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
                height: 16px;
                border-radius: 50%;
                border: 2px solid currentColor;
                border-right-color: transparent;
                animation: spin .7s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: translateY(-50%) rotate(360deg);
                }
            }

            @media (max-width: 560px) {
                .enquiry .modal {
                    width: 100vw;
                }
            }

            .enquiry .modal,
            .enquiry .form,
            .enquiry .input,
            .enquiry .select,
            .enquiry .phone,
            .enquiry .title,
            .enquiry .submit,
            .enquiry .agree {
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            /* ── FORM BUTTONS ── */

            .form-btn-row {
                display: flex;
                gap: 8px;
                margin-top: 8px;
            }

            .btn-callback {
                flex: 1;
                border: none;
                border-radius: 8px;
                padding: 13px;
                font-weight: 700;
                font-size: 13px;
                background: #fff;
                color: #111;
                cursor: pointer;
                transition: background 0.15s;
                font-family: 'DM Sans', -apple-system, sans-serif;
            }

            .btn-callback:hover {
                background: #e8e8e8;
            }

            .btn-callnow {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 13px 16px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 8px;
                background: transparent;
                color: #fff;
                font-size: 13px;
                font-weight: 500;
                text-decoration: none;
                font-family: 'DM Sans', -apple-system, sans-serif;
                transition: background 0.15s;
                white-space: nowrap;
            }

            .btn-callnow:hover {
                background: rgba(255, 255, 255, 0.1);
            }

        }
    </style>
</head>

    <script>
        (function () {
            const bar = document.getElementById('amenityBar');
            if (!bar) return;
            const links = bar.querySelectorAll('a');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    // Toggle active state — placeholder for future filter logic
                    if (link.classList.contains('active')) {
                        link.classList.remove('active');
                    } else {
                        links.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                    }
                    // If href is just "#", prevent navigation
                    if (link.getAttribute('href') === '#') e.preventDefault();
                });
            });
        })();
    </script>

                'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&q=80',
                'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200&q=80',
                'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1200&q=80',
                'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1200&q=80',
                'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200&q=80',
                'https://images.unsplash.com/photo-1600566753376-12c8ab7a5a1e?w=1200&q=80'
            ];
            let idx = 0;
            const overlay = document.getElementById('galleryOverlay');
            const img = document.getElementById('galleryImage');
            const counter = document.getElementById('galleryCurrent');
            const total = document.getElementById('galleryTotal');
            const thumbsWrap = document.getElementById('galleryThumbs');
            if (!overlay || !img) return;
            total.textContent = images.length;

            // Build thumbs
            images.forEach((src, i) => {
                const t = document.createElement('div');
                t.className = 'gallery-thumb' + (i === 0 ? ' is-active' : '');
                t.innerHTML = '<img src="' + src.replace('w=1200', 'w=120') + '" alt="">';
                t.addEventListener('click', () => goTo(i));
                thumbsWrap.appendChild(t);
            });

            function goTo(i) {
                idx = i; img.src = images[idx]; counter.textContent = idx + 1;
                thumbsWrap.querySelectorAll('.gallery-thumb').forEach((t, j) => t.classList.toggle('is-active', j === idx));
            }
            function open() { overlay.classList.add('is-open'); goTo(idx); }
            function close() { overlay.classList.remove('is-open'); }

            document.getElementById('galleryPrev').addEventListener('click', () => goTo((idx - 1 + images.length) % images.length));
            document.getElementById('galleryNext').addEventListener('click', () => goTo((idx + 1) % images.length));
            document.getElementById('galleryClose').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

            // Wire all gallery buttons
            document.querySelectorAll('[data-open-gallery]').forEach(btn => {
                btn.addEventListener('click', e => { e.preventDefault(); open(); });
            });
            // Keyboard
            document.addEventListener('keydown', e => {
                if (!overlay.classList.contains('is-open')) return;
                if (e.key === 'Escape') close();
                if (e.key === 'ArrowLeft') goTo((idx - 1 + images.length) % images.length);
                if (e.key === 'ArrowRight') goTo((idx + 1) % images.length);
            });
        })();
    </script>
    <script>
        // Walkthrough Video Modal
        (function () {
            const overlay = document.getElementById('walkthroughOverlay');
            const video = document.getElementById('walkthroughModalVideo');
            if (!overlay || !video) return;
            function open() { overlay.classList.add('is-open'); video.play().catch(() => { }); }
            function close() { overlay.classList.remove('is-open'); video.pause(); video.currentTime = 0; }
            document.getElementById('walkthroughClose').addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            document.querySelectorAll('[data-open-walkthrough]').forEach(btn => {
                btn.addEventListener('click', e => { e.preventDefault(); open(); });
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('is-open')) close(); });
        })();
    </script>

    <script>
        (function () {
            var btn = document.getElementById('enquiryBtn');
            var overlay = document.getElementById('enquiryOverlay');
            var closeBtn = document.getElementById('closeBtn');
            if (!btn || !overlay) return;
            btn.addEventListener('click', function () {
                overlay.classList.add('is-open');
                overlay.setAttribute('aria-hidden', 'false');
                btn.classList.add('is-hidden');
            });
            function close() {
                overlay.classList.remove('is-open');
                overlay.setAttribute('aria-hidden', 'true');
                btn.classList.remove('is-hidden');
            }
            if (closeBtn) closeBtn.addEventListener('click', close);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        })();
    </script>
